<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Geoportal</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- CSS propio -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div id="panel">
    <h2>Geoportal</h2>

    <div class="filtro">
      <label>Provincia</label>
      <input id="filtroProvincia" />
      <div id="autocomplete-provincia" class="autocomplete"></div>
    </div>

    <div class="filtro">
      <label>Departamento</label>
      <input id="filtroDepartamento" />
      <div id="autocomplete-departamento" class="autocomplete"></div>
    </div>

    <div class="filtro">
      <label>Nivel</label>
      <select id="filtroNivel">
        <option value="">Todos</option>
        <option value="alto">Alto</option>
        <option value="medio">Medio</option>
        <option value="bajo">Bajo</option>
      </select>
    </div>

    <button onclick="aplicarFiltros()">Buscar</button>
    <button onclick="limpiarFiltros()">Limpiar</button>

    <hr />

    <button onclick="toggleCapa('departamentos')">Departamentos</button>
    <button onclick="toggleCapa('provincias')">Provincias</button>

    <div id="cargando">Cargando datos…</div>
  </div>

  <div id="map"></div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- JS propio -->
  <script src="./main.js"></script>
</body>
</html>
